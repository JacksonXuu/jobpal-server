version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jobpal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: jobpal
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: jobpal-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  mysql_data:
