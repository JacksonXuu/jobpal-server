services:
  mysql:
    image: mysql:8.0
    container_name: jobpal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: jobpal
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobpal-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  server:
    build: .
    container_name: jobpal-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD}@mysql:3306/jobpal
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "npx prisma@6 db push && npx tsx prisma/seed.ts && node dist/src/main"

volumes:
  mysql_data:
